services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hr
      MYSQL_USER: hr_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D hr -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_DEMO: "false"
      DB_URL: jdbc:mysql://database:3306/hr?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: hr_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
volumes:
  mysql_data:
